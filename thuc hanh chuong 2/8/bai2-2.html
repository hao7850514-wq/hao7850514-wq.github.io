<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài 2.2 - Hiệu ứng bo góc ảnh</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-4">

    <h4>Bài 2.2: Tạo trang HTML hiển thị 3 hình ảnh với các lớp rounded khác nhau</h4>
    
    <div class="container text-center mt-4">
        <div class="row justify-content-center align-items-center">
            <div class="col-md-4">
                <img src="hinh1.jpg.webp" class="rounded img-fluid" alt="Rounded">
                <p class="mt-2 text-muted"><code>class="rounded"</code></p>
            </div>
            <div class="col-md-4">
                <img src="hinh1.jpg.webp" class="rounded-4 img-fluid" alt="Rounded 4">
                <p class="mt-2 text-muted"><code>class="rounded-4"</code></p>
            </div>
            <div class="col-md-4">
                <img src="hinh1.jpg.webp" class="rounded-circle img-fluid" alt="Rounded Circle">
                <p class="mt-2 text-muted"><code>class="rounded-circle"</code></p>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
