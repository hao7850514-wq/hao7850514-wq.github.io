<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài 2.9b: Tạo Card có Header và Footer</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-4">

    <h4>Bài 2.9: Tạo Card theo mẫu</h4>
    <p>b) Tạo Card có Header và Footer</p>

    <div class="card text-center" style="max-width: 45rem;">
        <div class="card-header">
            Featured
        </div>
        <div class="card-body">
            <h5 class="card-title fw-bold">NASA Launched Solar Probe</h5>
            <p class="card-text text-secondary">
                NASA launched Parker space probe in 2018 with the mission of making observations of the outer corona of the Sun. It is the first-ever mission to "touch" the Sun.
            </p>
            <a href="#" class="btn btn-dark btn-sm">Know more</a>
        </div>
        <div class="card-footer text-body-secondary">
            3 years ago
        </div>
    </div>

</body>
</html>
