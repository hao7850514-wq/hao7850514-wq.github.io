<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài 2.9e: Hiển thị 2 Card thông tin cá nhân</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-4">

    <h4>Bài 2.9: Tạo Card theo mẫu</h4>
    <p>e) Tạo card hiển thị các thông tin gồm Ảnh đại diện, Họ tên, Nút View Profile (Hiển thị 2 card)</p>

    <div class="container px-0">
        <div class="row g-4">
            
            <div class="col-md-4">
                <div class="card text-center shadow-sm">
                    <img src="hinh1.jpg.webp" class="card-img-top" alt="Ảnh đại diện">
                    <div class="card-body">
                        <h5 class="card-title fw-bold">Nguyễn Văn A</h5>
                        <a href="#" class="btn btn-dark btn-sm mt-2">View Profile</a>
                    </div>
                </div>
            </div>

            <div class="col-md-4">
                <div class="card text-center shadow-sm overflow-hidden">
                    <div class="card-body pt-3 pb-2"> 
                        <a href="#" class="btn btn-dark btn-sm mt-1 mb-2">View Profile</a>
                        <h5 class="card-title fw-bold">Nguyễn Văn A</h5>
                    </div>
                    <img src="hinh1.jpg.webp" class="w-100" alt="Ảnh đại diện">
                </div>
            </div>

        </div>
    </div>

</body>
</html>
