<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài 2.1 - Breadcrumb</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-4">

    <h4>Bài 2.1: Tạo Breadcrumb hiển thị đường dẫn chuyên mục</h4>
    <p class="text-muted mb-2">Đường dẫn chuyên mục:</p>
    
    <nav aria-label="breadcrumb">
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a href="#">Trang chủ</a></li>
            <li class="breadcrumb-item"><a href="#">Thư viện</a></li>
            <li class="breadcrumb-item"><a href="#">Giáo trình</a></li>
            <li class="breadcrumb-item active" aria-current="page">Thiết kế giao diện Web</li>
        </ol>
    </nav>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
