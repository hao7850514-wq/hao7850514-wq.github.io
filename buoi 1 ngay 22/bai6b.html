<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Bài 1.6b - Bootstrap Grid</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <style>
        body {
            background-color: #f5f5f5;
            font-family: Arial, sans-serif;
        }

        .logo {
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .menu a {
            display: block;
            text-decoration: none;
            color: #333;
            padding: 10px;
        }

        .menu a:hover {
            background-color: #ddd;
        }

        .menu .active {
            background-color: #555;
            color: white;
        }

        .dashboard {
            background-color: #e9e9e9;
            padding: 20px;
            margin-bottom: 15px;
        }

        .box {
            background-color: white;
            border: 1px solid #ddd;
            padding: 20px;
            min-height: 110px;
        }

        .number {
            font-size: 16px;
            margin-top: 10px;
        }

        .text-box {
            background-color: white;
            border: 1px solid #ddd;
            padding: 20px;
            min-height: 130px;
        }
    </style>
</head>

<body>

<div class="container-fluid mt-4">

    <div class="row">

        <div class="col-md-3 col-lg-3">

            <div class="logo">
                Logo
            </div>

            <div class="menu">

                <a href="#" class="active">
                    Dashboard
                </a>

                <a href="#">
                    Age
                </a>

                <a href="#">
                    Gender
                </a>

                <a href="#">
                    Geo
                </a>

            </div>

        </div>


        <div class="col-md-9 col-lg-9">

            <div class="dashboard">

                <h5>Dashboard</h5>

                <p class="mb-0">
                    Some text..
                </p>

            </div>

            <div class="row g-3">

                <div class="col-sm-6 col-lg-3">

                    <div class="box">

                        <h6>Users</h6>

                        <div class="number">
                            1 Million
                        </div>

                    </div>

                </div>


                <div class="col-sm-6 col-lg-3">

                    <div class="box">

                        <h6>Pages</h6>

                        <div class="number">
                            100 Million
                        </div>

                    </div>

                </div>


                <div class="col-sm-6 col-lg-3">

                    <div class="box">

                        <h6>Sessions</h6>

                        <div class="number">
                            10 Million
                        </div>

                    </div>

                </div>

                <div class="col-sm-6 col-lg-3">

                    <div class="box">

                        <h6>Bounce</h6>

                        <div class="number">
                            30%
                        </div>

                    </div>

                </div>

            </div>

            <div class="row g-3 mt-1">

                <div class="col-sm-6 col-lg-4">

                    <div class="text-box">

                        <p>Text</p>
                        <p>Text</p>
                        <p>Text</p>

                    </div>

                </div>


                <div class="col-sm-6 col-lg-4">

                    <div class="text-box">

                        <p>Text</p>
                        <p>Text</p>
                        <p>Text</p>

                    </div>

                </div>


                <div class="col-sm-12 col-lg-4">

                    <div class="text-box">

                        <p>Text</p>
                        <p>Text</p>
                        <p>Text</p>

                    </div>

                </div>

            </div>


            <div class="row g-3 mt-1">

                <div class="col-sm-6 col-lg-8">

                    <div class="text-box">
                        <p>Text</p>
                    </div>

                </div>

                <div class="col-sm-6 col-lg-4">

                    <div class="text-box">
                        <p>Text</p>
                    </div>

                </div>

            </div>

        </div>

    </div>

</div>


<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js">
</script>

</body>
</html>
